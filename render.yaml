services:
  - type: web
    name: design-atlas
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=2592000
      - path: /support.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000
