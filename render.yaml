services:
  - type: web
    name: design-atlas
    runtime: static
    buildCommand: echo "Static site - no build step"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /404.html
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache
      - path: /sitemap.xml
        name: Cache-Control
        value: no-cache
      - path: /robots.txt
        name: Cache-Control
        value: no-cache
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/icons/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /assets/og-image.png
        name: Cache-Control
        value: public, max-age=2592000
