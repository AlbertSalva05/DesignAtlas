<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:100%">
  <button type="button" onClick="{{ r.open }}" style="display:flex;flex-direction:column;width:100%;height:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;color:var(--ink);font:inherit;box-shadow:0 1px 2px rgba(20,36,58,.06), 0 1px 1px rgba(20,36,58,.04);transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease" style-hover="border-color:var(--strong);box-shadow:0 2px 4px rgba(20,36,58,.06), 0 10px 24px -8px rgba(20,36,58,.18);transform:translateY(-2px)" style-active="box-shadow:0 1px 2px rgba(20,36,58,.06), 0 1px 1px rgba(20,36,58,.04);transform:translateY(0)">
    <sc-if value="{{ r.typographic }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;aspect-ratio:16/10;width:100%;background:{{ r.coverBg }};color:{{ r.coverFg }};padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-bottom:1px solid var(--line)">
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;padding-right:48px"><i class="ph {{ r.icon }}" aria-hidden="true" style="font-size:18px"></i><span>{{ r.catLabel }}</span></span>
        <span style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
          <span style="font-family:'Source Serif 4',Georgia,serif;font-size:26px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;min-width:0">{{ r.name }}</span>
          <span style="flex:0 0 auto;width:52px;height:52px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(20,36,58,.12), 0 6px 14px -6px rgba(20,36,58,.3)"><img src="{{ r.logo }}" alt="" width="32" height="32" loading="lazy" decoding="async" style="width:32px;height:32px;object-fit:contain"></span>
        </span>
        <sc-if value="{{ r.shot }}"><img src="{{ r.shot }}" srcSet="{{ r.shotSet }}" sizes="(min-width: 640px) 320px, 100vw" width="480" height="300" alt="{{ r.shotAlt }}" loading="lazy" decoding="async" fetchPriority="low" crossOrigin="anonymous" data-raw="{{ r.shotRaw }}" onLoad="{{ r.shotLoad }}" onError="{{ r.shotErr }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:var(--surface)"><span aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,36,58,0) 45%,rgba(20,36,58,.16) 100%),rgba(20,36,58,.04);box-shadow:inset 0 0 0 1px rgba(20,36,58,.06)"></span></sc-if>
      <sc-if value="{{ r.shot }}">
        <span style="position:absolute;left:12px;bottom:12px;z-index:1;display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px);padding:4px 10px;border-radius:6px;background:rgba(20,36,58,.86);color:#F7F6F2;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><i class="ph {{ r.icon }}" aria-hidden="true" style="font-size:14px"></i>{{ r.catLabel }}</span>
      </sc-if>
      </div>
      <sc-if value="{{ r.shot }}">
        <div style="padding:16px 20px 0;display:flex;flex-direction:column;gap:2px">
          <span style="font-family:'Source Serif 4',Georgia,serif;font-size:21px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ r.name }}</span>
          <sc-if value="{{ r.hasCreator }}"><span style="font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">by {{ r.creator }}</span></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ r.noShot }}">
        <sc-if value="{{ r.hasCreator }}"><div style="padding:16px 20px 0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">by {{ r.creator }}</div></sc-if>
      </sc-if>
    </sc-if>
    <sc-if value="{{ r.placeholder }}">
      <div style="aspect-ratio:16/10;width:100%;background:repeating-linear-gradient(135deg,var(--sunk4) 0 10px,var(--sunk5) 10px 20px);display:flex;align-items:center;justify-content:center">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted2);background:var(--paper);padding:4px 8px;border-radius:4px">preview image · {{ r.domain }}</span>
      </div>
      <div style="padding:16px 20px 0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">{{ r.catLabel }}</span>
        <span style="font-family:'Source Serif 4',Georgia,serif;font-size:21px;line-height:1.2">{{ r.name }}</span>
        <sc-if value="{{ r.hasCreator }}"><span style="font-size:14px;color:var(--muted)">by {{ r.creator }}</span></sc-if>
      </div>
    </sc-if>
    <div style="padding:10px 20px 16px;flex:1">
      <p style="margin:0;font-size:15px;line-height:1.45;color:var(--body2);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ r.desc }}</p>
    </div>
    <div style="margin-top:auto;padding:12px 20px;border-top:1px solid var(--line3);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-width:0">
      <span style="flex:none;display:flex;align-items:center;gap:6px">
        <span style="flex:none;padding:2px 8px;border-radius:4px;background:var(--ink);color:var(--paper);font-weight:700;font-size:12px;letter-spacing:.02em">{{ r.price }}</span>
        <span title="{{ r.comLabel }}" style="flex:none;display:flex;align-items:center;gap:4px;padding:1px 8px;border-radius:4px;border:1px solid currentColor;color:{{ r.comFg }};font-weight:600;font-size:12px;white-space:nowrap"><i class="ph {{ r.comIcon }}" aria-hidden="true" style="font-size:14px"></i>{{ r.comLabel }}</span>
      </span>
      <sc-if value="{{ r.hasTools }}"><span style="flex:0 1 auto;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.toolsShort }}</span></sc-if>
    </div>
  </button>
  <sc-if value="{{ r.canSave }}">
    <button type="button" onClick="{{ r.toggleSave }}" aria-pressed="{{ r.savedAria }}" aria-label="{{ r.saveLabel }}" title="{{ r.saveLabel }}" style="position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:8px;border:1.5px solid {{ r.saveBorder }};background:{{ r.saveBg }};color:{{ r.saveFg }};display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s ease, color .2s ease, transform .15s ease" style-hover="transform:scale(1.06)" style-active="transform:scale(.94)"><i class="ph {{ r.saveIcon }}" aria-hidden="true" style="font-size:20px"></i></button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:400},&quot;r&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
