<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:100%">
  <button type="button" onClick="{{ r.open }}" style="display:flex;flex-direction:column;width:100%;height:100%;text-align:left;background:#FFFFFF;border:1px solid #DDD8CC;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;color:#14243A;font:inherit;transition:border-color .15s ease, box-shadow .15s ease" style-hover="border-color:#14243A;box-shadow:0 3px 0 #14243A">
    <sc-if value="{{ r.typographic }}" hint-placeholder-val="{{ true }}">
      <div style="aspect-ratio:16/10;width:100%;background:{{ r.coverBg }};color:{{ r.coverFg }};padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between">
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em;padding-right:48px"><i class="ph {{ r.icon }}" aria-hidden="true" style="font-size:18px"></i><span>{{ r.catLabel }}</span></span>
        <span style="font-family:'Source Serif 4',Georgia,serif;font-size:28px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance">{{ r.name }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ r.placeholder }}">
      <div style="aspect-ratio:16/10;width:100%;background:repeating-linear-gradient(135deg,#ECE8DE 0 10px,#F3F0E8 10px 20px);display:flex;align-items:center;justify-content:center">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#454C59;background:#F7F6F2;padding:4px 8px;border-radius:4px">preview image · {{ r.domain }}</span>
      </div>
    </sc-if>
    <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1">
      <sc-if value="{{ r.placeholder }}">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:13px;font-weight:600;color:#565D6B">{{ r.catLabel }}</span>
          <span style="font-family:'Source Serif 4',Georgia,serif;font-size:22px;line-height:1.15">{{ r.name }}</span>
        </div>
      </sc-if>
      <p style="margin:0;font-size:15px;line-height:1.45;color:#3A4352;text-wrap:pretty">{{ r.desc }}</p>
      <div style="margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px;color:#3A4352">
        <span style="border:1px solid #14243A;color:#14243A;border-radius:4px;padding:1px 7px;font-weight:600;font-size:13px">{{ r.price }}</span>
        <span style="display:flex;align-items:center;gap:5px"><i class="ph {{ r.comIcon }}" aria-hidden="true" style="font-size:16px"></i>{{ r.comLabel }}</span>
      </div>
      <span style="font-size:14px;color:#565D6B">{{ r.tools }}</span>
      <span style="font-size:14px;color:#565D6B">{{ r.creator }}</span>
    </div>
  </button>
  <sc-if value="{{ r.canSave }}">
    <button type="button" onClick="{{ r.toggleSave }}" aria-pressed="{{ r.savedAria }}" aria-label="{{ r.saveLabel }}" title="{{ r.saveLabel }}" style="position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:8px;border:1.5px solid {{ r.saveBorder }};background:{{ r.saveBg }};color:{{ r.saveFg }};display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s ease, color .2s ease, transform .15s ease" style-hover="transform:scale(1.06)" style-active="transform:scale(.94)"><i class="ph {{ r.saveIcon }}" aria-hidden="true" style="font-size:20px"></i></button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:400},&quot;r&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
